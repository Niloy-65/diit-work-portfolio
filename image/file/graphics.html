<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Design Showcase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet"
  />

  <!-- Animate.css for fade-in effects -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />

  <style>
  
    /* Global Reset & Typography */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f4f4f4;
      color: #333;
      overflow-x: hidden;
    }

    /* Smooth Scrolling */
    html {
      scroll-behavior: smooth;
    }

    /* Hero Section with Animated Gradient */
    .hero {
      height: 40vh;
      background: linear-gradient(45deg, #ff9900, #ff5722, #ff9800, #ffc107);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      padding: 2rem;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .hero h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.3);
    }

    .hero p {
      font-size: 1rem;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Container for the Gallery */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    /* Gallery Grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .gallery img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Hover Zoom */
    .gallery img:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    /* Certificate Link Styles */
    .certificate-link {
      display: block;
      background: #4CAF50;
      color: #fff;
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
      padding: 20px;
      border-radius: 10px;
      text-decoration: none;
      margin-top: 30px;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .certificate-link:hover {
      background: #388E3C;
      transform: scale(1.05);
    }

    /* Certificate Container Styles */
    .certificate-container {
      margin: 30px auto 10px auto;
      padding: 15px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      width: 50%;
      position: relative;
      animation: glow 2s infinite alternate;
    }

    .certificate-container img {
      width: 100%;
      border-radius: 10px;
      transition: transform 0.5s ease-in-out;
    }

    .certificate-container:hover img {
      transform: scale(1.05);
    }

    @keyframes glow {
      0% {
        box-shadow: 0 0 10px rgba(255, 165, 0, 0.5);
      }
      100% {
        box-shadow: 0 0 20px rgba(255, 165, 0, 1);
      }
    }

    /* Footer */
    footer {
      background: #333;
      color: #fff;
      text-align: center;
      padding: 1.5rem 1rem;
      margin-top: 2rem;
    }

    /* Title Styling */
    .t1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.3);
    }

  </style>
</head>
